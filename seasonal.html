<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AniTaste | Сейчас в эфире</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .seasonal-section {
            background: rgba(255, 255, 255, 0.98);
            color: #000000;
            padding: 50px 20px;
            margin-bottom: 50px;
            border: 4px solid #000000;
            box-shadow: 5px 5px 15px rgba(0, 0, 0, 0.3);
            max-width: 1400px;
            margin-left: auto;
            margin-right: auto;
        }
        .seasonal-section h2 {
            color: #000000;
            font-size: 2.5em;
            text-transform: uppercase;
            border-bottom: 4px solid #000000;
            padding-bottom: 20px;
            margin-bottom: 40px;
            text-align: center;
        }
        .seasonal-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .seasonal-card {
            position: relative;
            border: 3px solid #000000;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            aspect-ratio: 3/4;
        }
        .seasonal-card:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }
        .seasonal-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .seasonal-info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.7) 70%, transparent 100%);
            padding: 30px 15px 15px;
            color: white;
        }
        .seasonal-info h4 {
            font-size: 1.1em;
            margin-bottom: 8px;
            line-height: 1.3;
            font-weight: bold;
        }
        .seasonal-score {
            color: #ffa500;
            font-weight: bold;
        }
        .loading {
            text-align: center;
            padding: 50px;
            font-size: 1.3em;
            color: #666;
        }
        @media (max-width: 768px) {
            .seasonal-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 480px) {
            .seasonal-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <nav class="top-nav">
        <div class="nav-container">
            <a href="index.html" class="nav-link">НА ГЛАВНУЮ</a>
            <a href="about.html" class="nav-link">О ПРОЕКТЕ</a>
            <a href="top.html" class="nav-link">ТОП АНИМЕ</a>
            <a href="seasonal.html" class="nav-link">В ЭФИРЕ</a>
        </div>
    </nav>

    <button class="settings-btn" id="settingsBtn" title="Настройки">⚙️</button>
    
    <div id="settingsModal" class="settings-modal">
        <p>🔧 Настройки</p>
        <div id="cookieStats"><p style="color: #999;">Нажмите "Показать cookies"</p></div>
        <button onclick="showCookieStats()" class="settings-action-btn">📊 Показать cookies</button>
        <button onclick="toggleSakura()" class="settings-action-btn" id="sakuraToggleBtn">🌸 Выключить сакуру</button>
        <button onclick="clearAllCookies()" class="settings-action-btn danger">🗑️ Очистить cookies</button>
    </div>

    <main class="content">
        <section class="seasonal-section">
            <h2>🌟 Сейчас в эфире</h2>
            <div id="seasonalAnimeContainer">
                <div class="loading">⏳ Загрузка...</div>
            </div>
        </section>
    </main>

    <footer><p>© 2026 Андрей Богдановский | AniTaste</p></footer>

    <script src="sakura.js"></script>
    <script src="cookies.js"></script>
    <script src="anime-api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const currentPage = window.location.pathname.split('/').pop();
            document.querySelectorAll('.nav-link').forEach(link => {
                if (link.getAttribute('href') === currentPage) {
                    link.style.opacity = '0.3';
                    link.style.pointerEvents = 'none';
                }
            });

            const seasonalContainer = document.getElementById('seasonalAnimeContainer');
            if (seasonalContainer) {
                AnimeAPI.getCurrentSeason().then(anime => {
                    AnimeDisplay.displaySeasonalAnime(anime);
                });
            }
        });

        const settingsBtn = document.getElementById('settingsBtn');
        const settingsModal = document.getElementById('settingsModal');
        let isModalOpen = false;

        function toggleSettings() {
            isModalOpen = !isModalOpen;
            if (isModalOpen) {
                settingsBtn.classList.add('rotating');
                setTimeout(() => { settingsModal.classList.add('active'); showCookieStats(); }, 300);
                setTimeout(() => settingsBtn.classList.remove('rotating'), 600);
            } else {
                settingsBtn.classList.add('rotating');
                settingsModal.classList.remove('active');
                setTimeout(() => settingsBtn.classList.remove('rotating'), 600);
            }
        }

        settingsBtn.addEventListener('click', toggleSettings);
        document.addEventListener('click', (e) => {
            if (isModalOpen && !settingsModal.contains(e.target) && !settingsBtn.contains(e.target)) toggleSettings();
        });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && isModalOpen) toggleSettings(); });
    </script>


<!-- AI Компаньон АиРин -->
<script src="ai-companion.js"></script>
</body>
</html>
